<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMBER &amp; LEAF</title>
<style>
:root{--bg:#faf6f0;--fg:#2b211b;--card:#fff;--mut:#7a6a5d;--ac:#b4471f;--ac2:#3f5a3a;--bd:#e4d9cb;--warn:#fff3d6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1613;--fg:#f3e9de;--card:#2a211c;--mut:#b5a493;--ac:#e0794d;--ac2:#8fb487;--bd:#43372f;--warn:#3b3220;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1c1613;--fg:#f3e9de;--card:#2a211c;--mut:#b5a493;--ac:#e0794d;--ac2:#8fb487;--bd:#43372f;--warn:#3b3220;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Georgia,'Times New Roman',serif}
h1,h2,h3{font-weight:600;margin:.2em 0}button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--bd);background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-size:20px;letter-spacing:.15em;font-weight:700}.logo b{color:var(--ac)}
nav{display:flex;gap:6px;flex-wrap:wrap}nav button{border:0;background:none;padding:8px 12px;border-radius:20px;cursor:pointer}nav button.on{background:var(--ac);color:#fff}
main{max-width:1080px;margin:0 auto;padding:20px}
.banner{background:var(--warn);border:1px solid var(--bd);padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer}.btn.alt{background:none;color:var(--fg);border:1px solid var(--bd)}.btn:disabled{opacity:.45;cursor:not-allowed}
.opt{display:block;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;cursor:pointer;margin-bottom:8px;background:var(--card)}.opt.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.opt small{display:block;color:var(--mut)}
.steps{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto}.steps span{flex:1;min-width:64px;text-align:center;font-size:11px;padding:6px 2px;border-bottom:3px solid var(--bd);color:var(--mut);cursor:pointer}.steps .done{border-color:var(--ac2);color:var(--fg)}.steps .cur{border-color:var(--ac);color:var(--ac);font-weight:700}
.lay{display:grid;gap:18px;grid-template-columns:1fr 320px}@media(max-width:820px){.lay{grid-template-columns:1fr}}
.pend{height:96px;border:2px dashed var(--bd);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--mut);background:repeating-linear-gradient(45deg,transparent 0 8px,var(--bd) 8px 9px)}
.pimg{width:100%;height:96px;object-fit:cover;border-radius:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);margin:4px 0 10px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--bd);padding:7px 9px;text-align:left;vertical-align:top}th{background:var(--card)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bd)}.ok{background:var(--ac2);color:#fff}
.qty button{width:28px;height:28px;border-radius:6px;border:1px solid var(--bd);background:var(--card);cursor:pointer}
.sum{position:sticky;top:calc(70px + env(safe-area-inset-top,0px));align-self:start}.sum hr{border:0;border-top:1px solid var(--bd)}
.err{color:#c0392b;font-size:13px}.mut{color:var(--mut);font-size:13px}
</style></head><body>
<header><div class="logo">EMBER <b>&amp;</b> LEAF</div>
<nav id="nav"></nav></header>
<main id="app"></main>
<script>
"use strict";
/* ============ CONFIG: replace these with API/database calls ============ */
const CUR="₹", LEAD_DAYS=3, CUTOFF_H=48, SHIP=60;
const BLACKOUT=["2026-12-25","2027-01-01"];               // admin-managed
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const CARRIER={sundayOk:false,scheduledWindows:false};      // carrier capability flags
const WINDOWS=["8 AM–11 AM","11 AM–2 PM","2 PM–5 PM","5 PM–8 PM","Any time"];
const FREQ=[{k:"weekly",l:"Weekly",d:"A shipment every 7 days",on:1},{k:"biweekly",l:"Every two weeks",d:"A shipment every 14 days",on:1},{k:"monthly",l:"Monthly",d:"One shipment per calendar month",on:1}];
const DURS=[1,3,6,12,18];
const DISCOUNT={1:0,3:0,6:0,12:0,18:0};                     // % — none configured yet
const CATS=[{k:"coffee",l:"Coffee",d:"Coffee bags only, whole bean or ground."},{k:"tea",l:"Tea",d:"Loose-leaf teas and infusions."},{k:"mixed",l:"Mixed tea &amp; coffee",d:"Both in one shipment where packing rules allow."},{k:"discovery",l:"Curated discovery",d:"Rotating selections chosen by our team."},{k:"gift",l:"Gift",d:"For someone else. Does not auto-renew."}];
const GRINDS=["Whole bean","Espresso","Moka pot","French press","Pour-over","Drip machine","AeroPress","Cold brew"];
const T=[["Assam Breakfast Tea","Black"],["Darjeeling First Flush","Black"],["Darjeeling Second Flush","Black"],["Nilgiri Orthodox Tea","Black"],["English Breakfast Blend","Black blend"],["Earl Grey","Flavoured black"],["Masala Chai","Spiced black"],["Kashmiri Kahwa","Spiced green"],["Moroccan Mint","Green blend"],["Jasmine Green Tea","Scented green"],["Sencha Green Tea","Green"],["Dragon Well–Style Green Tea","Green"],["Genmaicha","Green"],["Matcha","Powdered green"],["White Peony","White"],["Silver Needle","White"],["Tieguanyin","Oolong"],["Da Hong Pao–Style Oolong","Oolong"],["Roasted Oolong","Oolong"],["Chamomile Flowers","Herbal"],["Peppermint Leaves","Herbal"],["Hibiscus Infusion","Herbal"],["Rooibos","Herbal"],["Lemongrass and Ginger","Herbal"],["Rose and Cardamom Blend","Herbal"]];
const C=[["Arabica House Blend","House blend"],["Espresso Reserve","Espresso blend"],["Morning Light Roast","Light"],["Classic Medium Roast","Medium"],["Dark Roast Reserve","Dark"],["Monsoon Malabar–Style","Indian concept"],["Karnataka Estate","Estate"],["Coorg Estate","Estate"],["Chikmagalur Estate","Estate"],["Baba Budangiri–Style","Indian concept"],["Araku Valley","Indian concept"],["Nilgiri Estate","Estate"],["Ethiopian Single Origin","Single origin"],["Colombian Single Origin","Single origin"],["Brazilian Single Origin","Single origin"],["Kenyan Single Origin","Single origin"],["Guatemalan Single Origin","Single origin"],["Costa Rican Single Origin","Single origin"],["Indonesian Single Origin","Single origin"],["Papua New Guinea Single Origin","Single origin"],["Decaffeinated Arabica","Decaf"],["Cold Brew Blend","Brew blend"],["French Press Blend","Brew blend"],["Pour-Over Reserve","Brew selection"],["Seasonal Micro-Lot","Limited batch"]];
const PRODUCTS=[...T.map((p,i)=>mk(p,"tea",i,[["100 g",300],["250 g",700]])),...C.map((p,i)=>mk(p,"coffee",i,[["250 g",450],["500 g",850]]))];
function mk(p,cat,i,vs){const m=1+(i%5)*.06;return{id:cat[0]+i,name:p[0],type:p[1],cat,stock:20,vars:vs.map(v=>({w:v[0],price:Math.round(v[1]*m/10)*10,sku:(cat[0]+"-"+(i+1)+"-"+v[0]).replace(/\s/g,"").toUpperCase()}))}}
const PLANS=[
["A","Daily Ritual","Everyday drinkers","Tea or coffee","Medium","1–3","Weekly / monthly","Yes","coffee"],
["B","Coffee Explorer","Coffee discoverers","Coffee","Medium","2–4","All","Yes","coffee"],
["C","Tea Discovery Club","Loose-leaf explorers","Tea","Medium","3–5","All","Yes","tea"],
["D","Signature Essentials","Set-and-forget","Tea or coffee","Low","1–4","All","Yes","coffee"],
["E","Premium Reserve","Limited-batch fans","Both","High","2–4","Biweekly / monthly","Yes","mixed"],
["F","Mixed Ritual Box","Tea and coffee lovers","Mixed","High","2–6","All","Yes","mixed"],
["G","Office &amp; Team","Offices, studios","Both","High","Bulk (quote)","Weekly / monthly","No","mixed"],
["H","Gift Subscription","Occasions","Tea, coffee or mixed","Medium","1–4","Monthly","Prepaid, no renewal","gift"],
["I","Bestsellers Box","Safe choices","Both","Low","3–4","Monthly","Yes","mixed"],
["J","Seasonal Discovery","Seasonal variety","Both","Low","2–3","Monthly","Yes","discovery"]];
/* ============ STATE ============ */
const STEPS=["Category","Frequency","Duration","Products","Preferences","Delivery","Address","Start","Review"];
const blank=()=>({step:0,cat:"",freq:"",dur:0,mode:"fixed",items:{},grind:"Whole bean",roast:"Any",caf:"Regular",tealeaf:"Any",day:3,win:"Any time",addr:{name:"",line:"",city:"",pin:"",notes:""},start:"",gift:{n:"",msg:""},agree:false,q:"",f:"all"});
let S=blank(),view="plans",sub=load("el_sub"),IMG=load("el_img")||{},toast="";
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const $=s=>document.querySelector(s),money=n=>CUR+n.toLocaleString("en-IN"),pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),fd=d=>d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
const pd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c,12)};
/* ============ SCHEDULING ENGINE (mirror this server-side) ============ */
function addMonths(d,n){const t=new Date(d.getFullYear(),d.getMonth()+n,1,12),dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d.getDate(),dim));return t}
function addDays(d,n){const t=new Date(d);t.setDate(t.getDate()+n);return t}
function okDay(d,wd){return d.getDay()===wd&&!BLACKOUT.includes(iso(d))}
function nextOk(d,wd){let t=new Date(d);for(let i=0;i<60&&!okDay(t,wd);i++)t=addDays(t,1);return t}
function earliest(){return addDays(new Date(new Date().setHours(12,0,0,0)),LEAD_DAYS)}
function schedule(freq,months,first,wd){
  const end=addMonths(first,months),out=[];
  if(freq==="monthly"){for(let i=0;;i++){const d=nextOk(addMonths(first,i),wd);if(addMonths(first,i)>=end)break;out.push(d)}}
  else{const st=freq==="weekly"?7:14;for(let d=new Date(first);d<end;d=addDays(d,st))out.push(nextOk(d,wd))}
  return out}
/* ============ PRICING (display only — server must recompute) ============ */
function lines(){return Object.entries(S.items).filter(([,x])=>x.q>0).map(([id,x])=>{const p=PRODUCTS.find(p=>p.id===id),v=p.vars[x.v];return{p,v,q:x.q,t:v.price*x.q}})}
function perShip(){const l=lines(),sub=l.reduce((a,x)=>a+x.t,0);return{sub,ship:l.length?SHIP:0,tot:sub+(l.length?SHIP:0),n:l.reduce((a,x)=>a+x.q,0)}}
function firstDate(){const e=earliest();let b=S.start?pd(S.start):e;if(b<e)b=e;return nextOk(b,+S.day)}
function plan(){return S.freq&&S.dur?schedule(S.freq,S.dur,firstDate(),+S.day):[]}
function eligible(){return PRODUCTS.filter(p=>S.cat==="coffee"?p.cat==="coffee":S.cat==="tea"?p.cat==="tea":true)}
/* ============ RENDER ============ */
function nav(){$("#nav").innerHTML=[["plans","Plans"],["build","Build your own"],["dash","My subscriptions"],["admin","Admin: images"]].map(([k,l])=>`<button class="${view===k?"on":""}" onclick="go('${k}')">${l}</button>`).join("")}
function go(v){view=v;render()}
function render(){nav();$("#app").innerHTML=({plans:vPlans,build:vBuild,dash:vDash,admin:vAdmin})[view]();draw();window.scrollTo(0,0)}
const demo=`<div class="banner"><b>Demo catalog.</b> Product names are planning concepts from the specification, not stocked items. Prices are placeholders. No real photographs have been supplied yet, so every product shows an “Image pending” state and would be excluded from a live storefront.</div>`;
function vPlans(){return demo+`<h2>Choose a plan</h2><p class="mut">Plan content below is sample configuration. Prices and features load from admin records in production; no “Most Popular” badge is shown because no order data exists.</p>
<div class="tw"><table><tr><th>Plan</th><th>Best for</th><th>Selection</th><th>Customisation</th><th>Products / shipment</th><th>Frequencies</th><th>Gift / renewal</th><th>Price</th><th></th></tr>`+PLANS.map(p=>`<tr><td><b>${p[1]}</b></td><td>${p[2]}</td><td>${p[3]}</td><td>${p[4]}</td><td>${p[5]}</td><td>${p[6]}</td><td>${p[7]}</td><td class="mut">Based on your picks + ${money(SHIP)} shipping</td><td><button class="btn" onclick="pick('${p[8]}')">Select</button></td></tr>`).join("")+`</table></div>
<div class="card" style="margin-top:16px"><h3>Build Your Own Plan</h3><p class="mut">Pick every product, size, grind, day and duration yourself.</p><button class="btn" onclick="pick('')">Start building</button></div>`}
function pick(c){S=blank();if(c){S.cat=c;S.step=1}view="build";render()}
function vBuild(){
  if(!S.cat&&S.step>0)S.step=0;
  const bar=`<div class="steps">${STEPS.map((s,i)=>`<span class="${i<S.step?"done":i===S.step?"cur":""}" onclick="jump(${i})">${i+1}. ${s}</span>`).join("")}</div>`;
  const body=[s0,s1,s2,s3,s4,s5,s6,s7,s8][S.step]();
  const last=S.step===8;
  return demo+bar+`<div class="lay"><div>${body}<div class="row sp" style="margin-top:14px"><button class="btn alt" ${S.step?"":"disabled"} onclick="jump(S.step-1)">Back</button>${last?"":`<button class="btn" ${valid()?"":"disabled"} onclick="jump(S.step+1)">Continue</button>`}</div></div>${summary()}</div>`}
function valid(){const s=S.step;if(s===0)return !!S.cat;if(s===1)return !!S.freq;if(s===2)return !!S.dur;if(s===3)return lines().length>0;if(s===6){const a=S.addr;return a.name&&a.line&&a.city&&/^\d{6}$/.test(a.pin)&&(S.cat!=="gift"||S.gift.n)}return true}
function jump(i){if(i>S.step&&!valid())return;S.step=Math.max(0,Math.min(8,i));render()}
function opts(list,cur,fn){return list.map(o=>`<label class="opt ${cur===o.k?"on":""}" onclick="${fn}('${o.k}')"><b>${o.l}</b><small>${o.d||""}</small></label>`).join("")}
function s0(){return`<h2>What kind of membership?</h2>`+opts(CATS,S.cat,"setCat")}
function setCat(k){S.cat=k;if(k==="gift")S.mode="fixed";S.items={};render()}
function s1(){return`<h2>How often should we deliver?</h2><p class="mut">This is how often a shipment arrives, not how long the plan lasts.</p>`+opts(FREQ.filter(f=>f.on),S.freq,"setF")}
function setF(k){S.freq=k;render()}
function s2(){return`<h2>How long should it run?</h2>`+opts(DURS.map(d=>({k:d,l:d+(d===1?" month":" months"),d:DISCOUNT[d]?DISCOUNT[d]+"% discount":"No discount configured"})),S.dur,"setD")+`<h3>Billing model</h3>`+(S.cat==="gift"?`<p class="mut">Gift plans are prepaid and end after the chosen term. They never renew automatically.</p>`:`<label class="opt ${S.mode==="fixed"?"on":""}" onclick="setM('fixed')"><b>Fixed term (prepaid)</b><small>Pay once, receive the scheduled deliveries, then stop. No silent renewal.</small></label><label class="opt ${S.mode==="renew"?"on":""}" onclick="setM('renew')"><b>Auto-renewing</b><small>Charged each period until cancelled. Renewal, price and cancellation terms are shown before payment.</small></label>`)+`<p class="mut">Term rule: the plan ends on the calendar anniversary of the first delivery. Delivery count comes from the actual schedule.</p>`}
function setD(k){S.dur=+k;render()}function setM(k){S.mode=k;render()}
function s3(){return`<h2>Pick your products</h2><div class="row"><input type="search" placeholder="Search products" value="${S.q}" oninput="S.q=this.value;draw()" style="flex:2"><select onchange="S.f=this.value;draw()" style="flex:1"><option value="all">All types</option>${[...new Set(eligible().map(p=>p.type))].map(t=>`<option ${S.f===t?"selected":""}>${t}</option>`).join("")}</select></div><div id="pl" class="grid"></div>`}
function draw(){const el=$("#pl");if(!el)return;const q=S.q.toLowerCase();el.innerHTML=eligible().filter(p=>(S.f==="all"||p.type===S.f)&&(p.name+p.type).toLowerCase().includes(q)).map(card).join("")||`<p class="mut">No matches.</p>`}
function card(p){const x=S.items[p.id]||{v:0,q:0},im=IMG[p.id],ok=im&&im.approved,out=p.stock<1;
  return`<div class="card">${ok?`<img class="pimg" src="${im.url}" alt="${p.name}, ${p.vars[x.v].w}">`:`<div class="pend">Image pending<br>(awaiting real photo)</div>`}<div class="row sp" style="margin-top:8px"><b>${p.name}</b></div><div class="mut">${p.cat==="tea"?"Tea":"Coffee"} · ${p.type}</div><div class="mut">Flavour notes: not yet verified</div>
<select onchange="setV('${p.id}',this.value)" ${out?"disabled":""}>${p.vars.map((v,i)=>`<option value="${i}" ${x.v===i?"selected":""}>${v.w} — ${money(v.price)}</option>`).join("")}</select>
<div class="row sp qty"><span class="tag ${out?"":"ok"}">${out?"Out of stock":"In stock"}</span><span><button ${out?"disabled":""} onclick="qty('${p.id}',-1)">−</button> <b>${x.q}</b> <button ${out?"disabled":""} onclick="qty('${p.id}',1)">+</button></span></div></div>`}
function setV(id,v){const x=S.items[id]||(S.items[id]={v:0,q:0});x.v=+v;draw();sumRefresh()}
function qty(id,d){const x=S.items[id]||(S.items[id]={v:0,q:0}),p=PRODUCTS.find(p=>p.id===id);x.q=Math.max(0,Math.min(Math.min(p.stock,10),x.q+d));draw();sumRefresh()}
function sumRefresh(){const e=$("#sum");if(e)e.outerHTML=summary()}
function s4(){const hasC=lines().some(l=>l.p.cat==="coffee"),hasT=lines().some(l=>l.p.cat==="tea");
  const sel=(l,k,arr)=>`<label>${l}<select onchange="S.${k}=this.value;sumRefresh()">${arr.map(a=>`<option ${S[k]===a?"selected":""}>${a}</option>`).join("")}</select></label>`;
  return`<h2>Preferences</h2><p class="mut">Only options that apply to your selected products appear. Grind availability is confirmed per product by the admin.</p>`+(hasC?`<div class="card"><h3>Coffee</h3>${sel("Grind","grind",GRINDS)}${sel("Roast preference","roast",["Any","Light","Medium","Medium-dark","Dark"])}${sel("Caffeine","caf",["Regular","Decaffeinated"])}</div>`:"")+(hasT?`<div class="card" style="margin-top:12px"><h3>Tea</h3>${sel("Format","tealeaf",["Any","Loose-leaf","Powdered (matcha)"])}<p class="mut">Caffeine status is shown only where verified for the product.</p></div>`:"")}
function s5(){const wds=[1,2,3,4,5,6,0].filter(d=>d!==0||CARRIER.sundayOk);
  return`<h2>Delivery day &amp; window</h2><label>Preferred weekday<select onchange="S.day=+this.value;sumRefresh()">${wds.map(d=>`<option value="${d}" ${+S.day===d?"selected":""}>${DAYS[d]}</option>`).join("")}</select></label>
<label>Preferred time window<select onchange="S.win=this.value;sumRefresh()">${WINDOWS.map(w=>`<option ${S.win===w?"selected":""}>${w}</option>`).join("")}</select></label>
<p class="mut">${CARRIER.scheduledWindows?"Windows are booked with the carrier.":"Your current carrier does not support scheduled time windows, so this is recorded as a request, not a guarantee."} Sunday delivery is ${CARRIER.sundayOk?"available":"not offered"} for this service.</p>`}
function s6(){const a=S.addr,inp=(l,k)=>`<label>${l}<input type="text" value="${a[k]}" oninput="S.addr.${k}=this.value;chk()"></label>`;
  return`<h2>${S.cat==="gift"?"Recipient &amp; address":"Delivery address"}</h2>`+(S.cat==="gift"?`<label>Recipient name<input type="text" value="${S.gift.n}" oninput="S.gift.n=this.value;chk()"></label><label>Gift message (optional)<textarea rows="2" oninput="S.gift.msg=this.value">${S.gift.msg}</textarea></label>`:"")+inp("Contact name","name")+inp("Address line (building, floor, landmark)","line")+inp("City","city")+inp("PIN code (6 digits)","pin")+inp("Delivery instructions","notes")+`<p class="mut">Service availability is validated against configured service areas on the server.</p>`}
function chk(){document.querySelectorAll(".lay .btn:not(.alt)").forEach(b=>b.disabled=!valid())}
function s7(){const e=earliest();return`<h2>Start date</h2><label>Start on or after<input type="date" min="${iso(e)}" value="${S.start||iso(e)}" onchange="S.start=this.value;sumRefresh()"></label><p>First delivery: <b>${fd(firstDate())}</b></p><p class="mut">Three dates are separate: payment is taken at checkout, dispatch happens about ${LEAD_DAYS-1}–${LEAD_DAYS} days before arrival, and the delivery date above is an estimate.</p>`}
function s8(){const l=lines(),pr=perShip(),sc=plan(),tot=pr.tot*sc.length,rows=l.map(x=>`<tr><td>${x.p.name}</td><td>${x.v.w}</td><td>${x.v.sku}</td><td>${x.q}</td><td>${money(x.t)}</td></tr>`).join("");
  return`<h2>Review &amp; confirm</h2><div class="tw"><table><tr><th>Product</th><th>Size</th><th>SKU</th><th>Qty</th><th>Price</th></tr>${rows}</table></div>
<div class="card" style="margin-top:12px"><p>Category: <b>${CATS.find(c=>c.k===S.cat).l}</b> · ${FREQ.find(f=>f.k===S.freq).l} · ${S.dur} month(s) · <b>${sc.length}</b> deliveries</p>
<p>Preferences: ${S.grind}, ${S.roast} roast, ${S.caf}. Day: ${DAYS[S.day]}, window request: ${S.win}</p>
<p>Address: ${S.addr.name}, ${S.addr.line}, ${S.addr.city} ${S.addr.pin}</p>
<p>Per shipment: ${money(pr.sub)} + shipping ${money(pr.ship)} = <b>${money(pr.tot)}</b>. Taxes: calculated at checkout.</p>
<p>Total over term: <b>${money(tot)}</b> ${S.mode==="fixed"?"(prepaid, ends after the last delivery, no renewal)":"(auto-renews each period until you cancel)"}</p>
<p class="mut">Deliveries: ${sc.slice(0,6).map(fd).join(" · ")}${sc.length>6?" …":""}</p>
<p class="mut">Skip or pause up to ${CUTOFF_H} hours before dispatch. Cancel any time from your dashboard; fixed-term refund rules apply as disclosed.</p>
<label class="row"><input type="checkbox" ${S.agree?"checked":""} onchange="S.agree=this.checked;document.getElementById('pay').disabled=!this.checked"> I confirm the price, schedule, ${S.mode==="fixed"?"fixed term":"renewal"} and cancellation terms above.</label>
<button id="pay" class="btn" ${S.agree?"":"disabled"} onclick="confirmSub()">Confirm (sandbox, no real charge)</button></div>`}
function summary(){const pr=perShip(),sc=plan();return`<aside id="sum" class="card sum"><h3>Your plan</h3><div class="mut">${S.cat?CATS.find(c=>c.k===S.cat).l:"No category yet"}${S.freq?" · "+FREQ.find(f=>f.k===S.freq).l:""}${S.dur?" · "+S.dur+" mo":""}</div><hr>${lines().map(x=>`<div class="row sp"><span>${x.q}× ${x.p.name} (${x.v.w})</span><span>${money(x.t)}</span></div>`).join("")||`<p class="mut">No products yet</p>`}<hr><div class="row sp"><span>Items</span><span>${pr.n}</span></div><div class="row sp"><span>Shipping</span><span>${money(pr.ship)}</span></div><div class="row sp"><b>Per shipment</b><b>${money(pr.tot)}</b></div>${sc.length?`<div class="row sp"><span>Deliveries</span><span>${sc.length}</span></div><div class="row sp"><b>Term total</b><b>${money(pr.tot*sc.length)}</b></div>`:""}<p class="mut">Display estimate only; the server recalculates every price.</p></aside>`}
function confirmSub(){const pr=perShip(),sc=plan();sub={id:"SUB-"+Date.now().toString(36).toUpperCase(),status:"active",cat:S.cat,freq:S.freq,mode:S.mode,day:S.day,win:S.win,addr:S.addr,items:lines().map(x=>({n:x.p.name,w:x.v.w,q:x.q,sku:x.v.sku})),per:pr.tot,ships:sc.map(d=>({d:iso(d),st:"scheduled"}))};save("el_sub",sub);view="dash";render()}
/* ============ DASHBOARD ============ */
function vDash(){if(!sub)return`<h2>My subscriptions</h2><p class="mut">No subscription yet.</p><button class="btn" onclick="pick('')">Build one</button>`;
  const left=sub.ships.filter(s=>s.st==="scheduled").length,now=Date.now();
  return`<h2>My subscriptions</h2><div class="card"><div class="row sp"><b>${sub.id}</b><span class="tag ${sub.status==="active"?"ok":""}">${sub.status}</span></div>
<p>${sub.items.map(i=>`${i.q}× ${i.n} (${i.w})`).join(", ")}</p><p class="mut">${FREQ.find(f=>f.k===sub.freq).l} · ${DAYS[sub.day]} · window request: ${sub.win} · ${sub.mode==="fixed"?"Fixed term, no renewal":"Auto-renewing"} · ${left} deliveries remaining · ${money(sub.per)} per shipment</p>
<div class="row"><button class="btn alt" onclick="act('${sub.status==="paused"?"resume":"pause"}')" ${sub.status==="cancelled"?"disabled":""}>${sub.status==="paused"?"Resume":"Pause"}</button><button class="btn alt" onclick="act('cancel')" ${sub.status==="cancelled"?"disabled":""}>Cancel</button></div></div>
<h3 style="margin-top:16px">Delivery calendar</h3><div class="tw"><table><tr><th>Estimated delivery</th><th>Status</th><th>Edit window</th><th></th></tr>${sub.ships.map((s,i)=>{const dt=pd(s.d),open=dt.getTime()-now>CUTOFF_H*36e5*1+LEAD_DAYS*864e5*0&&s.st==="scheduled"&&sub.status==="active";return`<tr><td>${fd(dt)}</td><td>${s.st}</td><td class="mut">${s.st!=="scheduled"?"—":open?"Open":"Closed (cutoff passed)"}</td><td>${open?`<button class="btn alt" onclick="skip(${i})">Skip</button>`:""}</td></tr>`}).join("")}</table></div>
<p class="mut">Frontend demo: actions update local data. In production each action calls an authorised API endpoint.</p>`}
function act(a){sub.status=a==="pause"?"paused":a==="resume"?"active":"cancelled";if(a==="cancel")sub.ships.forEach(s=>{if(s.st==="scheduled")s.st="cancelled"});save("el_sub",sub);render()}
function skip(i){sub.ships[i].st="skipped";save("el_sub",sub);render()}
/* ============ ADMIN: IMAGE PROVENANCE ============ */
let AP=PRODUCTS[0].id;
function vAdmin(){const ap=Object.values(IMG).filter(i=>i.approved).length,im=IMG[AP]||{};
  return`<h2>Product image review</h2><p class="mut">${ap} of ${PRODUCTS.length} products have an approved authentic photo. Products without one stay unpublished. Generated or unlicensed images are not accepted.</p>
<div class="card"><label>Product<select onchange="AP=this.value;render()">${PRODUCTS.map(p=>`<option value="${p.id}" ${p.id===AP?"selected":""}>${p.name} ${IMG[p.id]&&IMG[p.id].approved?"✓":"(image pending)"}</option>`).join("")}</select></label>
<label>Photo file<input type="file" accept="image/*" onchange="pickImg(this)"></label>
${im.url?`<img class="pimg" style="height:160px;max-width:280px" src="${im.url}" alt="Preview">`:`<div class="pend" style="max-width:280px">Image pending</div>`}
<label>Source (e.g. brand-supplied, own photo, roaster)<input type="text" value="${im.src||""}" oninput="setI('src',this.value)"></label>
<label>Usage rights / licence<input type="text" value="${im.rights||""}" oninput="setI('rights',this.value)"></label>
<label>Alt text<input type="text" value="${im.alt||""}" oninput="setI('alt',this.value)"></label>
<label class="row"><input type="checkbox" ${im.shows?"checked":""} onchange="setI('shows',this.checked)"> I verify this photo shows this exact product and size</label>
<button class="btn" onclick="approve()">Approve for publishing</button> <span id="am" class="err"></span><p class="mut">Preview only: the file is kept in this browser. Production uploads to storage and records source and verification in the database.</p></div>`}
function setI(k,v){(IMG[AP]=IMG[AP]||{})[k]=v}
function pickImg(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{setI("url",r.result);setI("approved",false);render()};r.readAsDataURL(f)}
function approve(){const i=IMG[AP]||{};if(!i.url||!i.src||!i.rights||!i.alt||!i.shows){$("#am").textContent="Photo, source, rights, alt text and verification are all required.";return}
  i.approved=true;try{save("el_img",IMG)}catch(e){}render()}
render();
</script></body></html>
